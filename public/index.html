<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>밀크초코 네모 아레나 TPS - Rivals Style</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111118;
            font-family: 'Arial', sans-serif;
            user-select: none;
            cursor: pointer;
        }
        #crosshair {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: rgba(0, 243, 255, 0.9); font-size: 24px; pointer-events: none; display: none; z-index: 5;
            text-shadow: 0 0 6px rgba(0, 243, 255, 0.8);
        }
        #hit-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 0, 85, 0.4); opacity: 0; pointer-events: none; z-index: 4;
            transition: opacity 0.1s ease-in-out;
        }
        #hud {
            position: absolute; top: 20px; left: 20px; color: #fff; background: rgba(20, 20, 30, 0.85);
            padding: 12px 20px; border-radius: 12px; font-size: 14px; display: none; z-index: 5;
            border: 2px solid #00f3ff; box-shadow: 0 0 15px rgba(0, 243, 255, 0.3); pointer-events: none;
        }
        #instructions {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            color: #fff; background: rgba(20, 20, 30, 0.85); padding: 10px 20px;
            border-radius: 20px; font-size: 13px; pointer-events: none; text-align: center;
            display: none; z-index: 5; box-shadow: 0 0 15px rgba(0, 243, 255, 0.2); border: 1px solid #00f3ff;
        }
        #start-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #1a1a2e 0%, #0d0d15 100%); display: flex; justify-content: center;
            align-items: center; z-index: 10; cursor: default;
        }
        .modal-box {
            background: rgba(25, 25, 38, 0.95); padding: 30px 40px; border-radius: 20px; text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7); width: 340px; border: 2px solid #00f3ff;
        }
        .modal-box h2 { margin-top: 0; color: #00f3ff; text-shadow: 0 0 10px rgba(0, 243, 255, 0.5); }
        .modal-box p { color: #a0a0c0; }
        .modal-box input {
            width: 85%; padding: 10px; font-size: 15px; border: 2px solid #3a3a5c;
            border-radius: 8px; margin-bottom: 12px; text-align: center; outline: none; background: #12121a; color: #fff;
        }
        .modal-box input:focus { border-color: #00f3ff; box-shadow: 0 0 8px rgba(0, 243, 255, 0.4); }
        .color-picker-wrapper {
            margin-bottom: 15px; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 14px; color: #d0d0e0; font-weight: bold;
        }
        .modal-box input[type="color"] { width: 40px; height: 35px; border: none; border-radius: 6px; cursor: pointer; background: none; }
        .modal-box button {
            width: 100%; padding: 12px; font-size: 16px; background: linear-gradient(135deg, #00f3ff 0%, #0066ff 100%);
            border: none; border-radius: 8px; cursor: pointer; font-weight: bold; color: white;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.4); transition: transform 0.1s;
        }
        .modal-box button:hover { transform: scale(1.02); }
        .name-tag {
            position: absolute; color: #fff; background: rgba(20, 20, 30, 0.85);
            padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold;
            pointer-events: none; transform: translate(-50%, -100%); white-space: nowrap;
            display: none; box-shadow: 0 0 8px rgba(0, 243, 255, 0.3); border: 1px solid #00f3ff;
        }
        .my-tag { background: rgba(0, 102, 255, 0.9); border-color: #00f3ff; }
    </style>
</head>
<body>
    <div id="start-screen">
        <div class="modal-box">
            <h2>⚡ RIVALS ARENA</h2>
            <p style="font-size: 13px; margin-bottom: 15px;">하이퍼 네온 아레나 전투</p>
            <input type="text" id="room-input" value="라이벌방1" placeholder="방 이름">
            <input type="text" id="nickname-input" value="네모플레이어" maxlength="10" placeholder="닉네임">
            <div class="color-picker-wrapper">
                <label for="color-input">슈트 색상:</label>
                <input type="color" id="color-input" value="#00f3ff">
            </div>
            <button id="start-btn">아레나 입장</button>
        </div>
    </div>

    <div id="hit-overlay"></div>
    <div id="crosshair">+</div>
    <div id="hud">체력: <span id="my-hp" style="color:#00f3ff; font-weight:bold;">100</span> | 점수: <span id="my-score" style="color:#ff0055; font-weight:bold;">0</span></div>
    <div id="instructions">
        <strong>화면 클릭</strong>: 마우스 고정 | <strong>WASD</strong>: 이동 | <strong>SPACE</strong>: 점프 | <strong>좌클릭</strong>: 사격
    </div>
    <div id="my-name-tag" class="name-tag my-tag"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>

    <script>
        let gameStarted = false;
        let socket;
        let myHp = 100;
        let myScore = 0;
        const otherPlayers = {};
        const activeBullets = [];
        const obstacleBounds = [];

        const startScreen = document.getElementById('start-screen');
        const startBtn = document.getElementById('start-btn');
        const roomInput = document.getElementById('room-input');
        const nicknameInput = document.getElementById('nickname-input');
        const colorInput = document.getElementById('color-input');
        const instructions = document.getElementById('instructions');
        const hud = document.getElementById('hud');
        const crosshair = document.getElementById('crosshair');
        const hitOverlay = document.getElementById('hit-overlay');
        const myNameTag = document.getElementById('my-name-tag');
        const myHpSpan = document.getElementById('my-hp');
        const myScoreSpan = document.getElementById('my-score');

        // Rivals 스타일의 어두운 스페이스/사이버펑크 배경 및 조명
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a12);
        scene.fog = new THREE.FogExp2(0x0a0a12, 0.025);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // 네온 분위기의 라이팅
        scene.add(new THREE.AmbientLight(0x22223b, 1.2));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(20, 40, 20);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // 바닥 (다크 메탈 스타일)
        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(60, 60),
            new THREE.MeshStandardMaterial({ color: 0x161622, roughness: 0.4, metalness: 0.3 })
        );
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // 바닥 그리드 라인 추가 (사이버틱한 느낌)
        const gridHelper = new THREE.GridHelper(60, 30, 0x00f3ff, 0x22223b);
        gridHelper.position.y = 0.01;
        scene.add(gridHelper);

        // 외곽 높은 벽 (현대적인 메탈 패널)
        const wallMat = new THREE.MeshStandardMaterial({ color: 0x1f1f2e, roughness: 0.5, metalness: 0.5 });
        [-30, 30].forEach(x => {
            const w = new THREE.Mesh(new THREE.BoxGeometry(1, 12, 60), wallMat);
            w.position.set(x, 6, 0); scene.add(w);
        });
        [-30, 30].forEach(z => {
            const w = new THREE.Mesh(new THREE.BoxGeometry(60, 12, 1), wallMat);
            w.position.set(0, 6, z); scene.add(w);
        });

        // 맵 구조물 생성 (로블록스 Rivals 스타일: 엄폐물, 중앙 고가 플랫폼, 기둥)
        const obstacleMat = new THREE.MeshStandardMaterial({ color: 0x28283d, roughness: 0.3, metalness: 0.4 });
        
        // 1. 대형 중앙 고가 플랫폼 (높이 2.5)
        const platformGeo = new THREE.BoxGeometry(10, 2.5, 10);
        const platform = new THREE.Mesh(platformGeo, obstacleMat);
        platform.position.set(0, 1.25, 0);
        platform.castShadow = true;
        platform.receiveShadow = true;
        scene.add(platform);
        obstacleBounds.push({ minX: -5, maxX: 5, minZ: -5, maxZ: 5, maxY: 2.5 });

        // 플랫폼 진입용 램프 (경사로)
        const rampMat = new THREE.MeshStandardMaterial({ color: 0x33334d, roughness: 0.4 });
        const rampGeo = new THREE.BoxGeometry(4, 2.5, 6);
        
        // 앞쪽 램프
        const ramp1 = new THREE.Mesh(rampGeo, rampMat);
        ramp1.position.set(0, 0.6, -7);
        ramp1.rotation.x = -Math.PI / 8;
        scene.add(ramp1);

        // 뒤쪽 램프
        const ramp2 = new THREE.Mesh(rampGeo, rampMat);
        ramp2.position.set(0, 0.6, 7);
        ramp2.rotation.x = Math.PI / 8;
        scene.add(ramp2);

        // 2. 주변 엄폐물 박스들
        const boxGeo = new THREE.BoxGeometry(4, 4, 4);
        [[ -15, -15 ], [ 15, 15 ], [ -15, 15 ], [ 15, -15 ], [ 0, -20 ], [ 0, 20 ]].forEach(pos => {
            const obs = new THREE.Mesh(boxGeo, obstacleMat);
            obs.position.set(pos[0], 2, pos[1]);
            obs.castShadow = true;
            obs.receiveShadow = true;
            scene.add(obs);

            obstacleBounds.push({
                minX: pos[0] - 2,
                maxX: pos[0] + 2,
                minZ: pos[1] - 2,
                maxZ: pos[1] + 2,
                maxY: 4
            });
        });

        // 캐릭터 메쉬 구성 요소 (세련된 각진 디자인)
        const bodyGeo = new THREE.BoxGeometry(1.5, 1.5, 1.5);
        const eyeGeo = new THREE.BoxGeometry(0.2, 0.15, 0.05);
        const eyeMat = new THREE.MeshBasicMaterial({ color: 0x00f3ff });
        const gunGeo = new THREE.BoxGeometry(0.25, 0.25, 1.0);
        const gunMat = new THREE.MeshStandardMaterial({ color: 0x111118, metalness: 0.8, roughness: 0.2 });

        function createPlayerMesh(colorHex = '#00f3ff') {
            const group = new THREE.Group();
            const bodyMat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.2, metalness: 0.5 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.75;
            body.castShadow = true;
            group.add(body);

            const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
            leftEye.position.set(-0.35, 0.9, 0.77);
            group.add(leftEye);

            const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
            rightEye.position.set(0.35, 0.9, 0.77);
            group.add(rightEye);

            const gun = new THREE.Mesh(gunGeo, gunMat);
            gun.position.set(0.65, 0.6, 0.6);
            group.add(gun);

            return { group, body, gun };
        }

        let myPlayer;
        let playerVelocity = new THREE.Vector3();
        const playerSpeed = 0.16;
        const playerRadius = 0.75;
        const gravity = 0.02;
        const jumpForce = 0.42;
        let isGrounded = false;
        let currentFloorY = 0;
        const keys = { forward: false, backward: false, left: false, right: false };

        let cameraAngleX = 0;
        let cameraAngleY = 0.2;

        function getFloorHeight(x, z) {
            // 중앙 플랫폼 위인지 확인
            if (x >= -5 && x <= 5 && z >= -5 && z <= 5) {
                return 2.5;
            }
            return 0;
        }

        function checkCollision(x, z) {
            if (x - playerRadius < -29.5 || x + playerRadius > 29.5) return true;
            if (z - playerRadius < -29.5 || z + playerRadius > 29.5) return true;

            for (let obs of obstacleBounds) {
                // 바닥이 플랫폼 아래에 있을 때만 측면 충돌 처리 (플랫폼 위로 올라갈 수 있게)
                if (obs.maxY === 2.5 && myPlayer.group.position.y < 2.0) {
                    if (
                        x + playerRadius > obs.minX &&
                        x - playerRadius < obs.maxX &&
                        z + playerRadius > obs.minZ &&
                        z - playerRadius < obs.maxZ
                    ) {
                        return true;
                    }
                } else if (obs.maxY !== 2.5) {
                    if (
                        x + playerRadius > obs.minX &&
                        x - playerRadius < obs.maxX &&
                        z + playerRadius > obs.minZ &&
                        z - playerRadius < obs.maxZ
                    ) {
                        return true;
                    }
                }
            }
            return false;
        }

        renderer.domElement.addEventListener('click', () => {
            if (gameStarted && document.pointerLockElement !== renderer.domElement) {
                renderer.domElement.requestPointerLock();
            }
        });

        document.addEventListener('mousemove', (e) => {
            if (!gameStarted) return;
            if (document.pointerLockElement === renderer.domElement) {
                cameraAngleX -= e.movementX * 0.003;
                cameraAngleY -= e.movementY * 0.003;
                cameraAngleY = Math.max(-1.2, Math.min(1.4, cameraAngleY));
            }
        });

        window.addEventListener('mousedown', (e) => {
            if (!gameStarted) return;
            if (e.button === 0) {
                shootBullet();
            }
        });

        startBtn.addEventListener('click', () => {
            const roomId = roomInput.value.trim() || '라이벌방1';
            const nickname = nicknameInput.value.trim() || '네모플레이어';
            const selectedColor = colorInput.value;
            myNameTag.innerText = nickname;

            myPlayer = createPlayerMesh(selectedColor);
            scene.add(myPlayer.group);

            socket = io();
            socket.emit('joinRoom', { roomId, nickname, color: selectedColor });

            socket.on('currentPlayers', (players) => {
                Object.keys(players).forEach(id => {
                    if (id !== socket.id) addOtherPlayer(players[id]);
                });
            });

            socket.on('newPlayer', (playerData) => {
                addOtherPlayer(playerData);
            });

            socket.on('playerMoved', (playerData) => {
                if (otherPlayers[playerData.id]) {
                    otherPlayers[playerData.id].group.position.set(playerData.x, playerData.y, playerData.z);
                    otherPlayers[playerData.id].group.rotation.y = playerData.rotationY;
                }
            });

            socket.on('playerShooting', (data) => {
                createVisualBullet(data.x, data.y, data.z, data.dirX, data.dirY, data.dirZ, 0xff0055);
            });

            socket.on('updateStats', (players) => {
                if (players[socket.id]) {
                    myHp = players[socket.id].hp;
                    myScore = players[socket.id].score;
                    myHpSpan.innerText = myHp;
                    myScoreSpan.innerText = myScore;
                }
            });

            socket.on('damaged', () => {
                hitOverlay.style.opacity = '1';
                setTimeout(() => {
                    hitOverlay.style.opacity = '0';
                }, 150);
            });

            socket.on('playerDisconnected', (id) => {
                if (otherPlayers[id]) {
                    scene.remove(otherPlayers[id].group);
                    document.body.removeChild(otherPlayers[id].tag);
                    delete otherPlayers[id];
                }
            });

            startScreen.style.display = 'none';
            instructions.style.display = 'block';
            hud.style.display = 'block';
            crosshair.style.display = 'block';
            myNameTag.style.display = 'block';
            gameStarted = true;

            renderer.domElement.requestPointerLock();
        });

        function addOtherPlayer(data) {
            const mesh = createPlayerMesh(data.color || '#ff0055');
            mesh.group.position.set(data.x, data.y, data.z);
            scene.add(mesh.group);

            const tag = document.createElement('div');
            tag.className = 'name-tag';
            tag.innerText = data.nickname;
            document.body.appendChild(tag);

            otherPlayers[data.id] = { group: mesh.group, tag: tag, data: data };
        }

        const bulletGeo = new THREE.SphereGeometry(0.2, 8, 8);
        
        function shootBullet() {
            if (!myPlayer) return;

            const cosY = Math.cos(cameraAngleY);
            const sinY = Math.sin(cameraAngleY);
            const cosX = Math.cos(cameraAngleX);
            const sinX = Math.sin(cameraAngleX);
            const camDir = new THREE.Vector3(sinX * cosY, sinY, cosX * cosY).normalize();

            const gunTipPos = new THREE.Vector3();
            myPlayer.gun.getWorldPosition(gunTipPos);

            socket.emit('shoot', {
                x: gunTipPos.x, y: gunTipPos.y, z: gunTipPos.z,
                dirX: camDir.x, dirY: camDir.y, dirZ: camDir.z
            });

            createVisualBullet(gunTipPos.x, gunTipPos.y, gunTipPos.z, camDir.x, camDir.y, camDir.z, 0x00f3ff, true);
        }

        function createVisualBullet(x, y, z, dx, dy, dz, colorHex, isMine = false) {
            const mat = new THREE.MeshBasicMaterial({ color: colorHex });
            const bulletMesh = new THREE.Mesh(bulletGeo, mat);
            bulletMesh.position.set(x, y, z);
            scene.add(bulletMesh);

            activeBullets.push({
                mesh: bulletMesh,
                dir: new THREE.Vector3(dx, dy, dz).normalize(),
                life: 60,
                isMine: isMine
            });
        }

        window.addEventListener('keydown', (e) => {
            if (!gameStarted) return;
            if (e.code === 'KeyW' || e.code === 'ArrowUp') keys.forward = true;
            if (e.code === 'KeyS' || e.code === 'ArrowDown') keys.backward = true;
            if (e.code === 'KeyA' || e.code === 'ArrowLeft') keys.left = true;
            if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.right = true;
            if (e.code === 'Space' && isGrounded) {
                playerVelocity.y = jumpForce;
                isGrounded = false;
            }
        });

        window.addEventListener('keyup', (e) => {
            if (!gameStarted) return;
            if (e.code === 'KeyW' || e.code === 'ArrowUp') keys.forward = false;
            if (e.code === 'KeyS' || e.code === 'ArrowDown') keys.backward = false;
            if (e.code === 'KeyA' || e.code === 'ArrowLeft') keys.left = false;
            if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.right = false;
        });

        const tempVector = new THREE.Vector3();
        const forwardVector = new THREE.Vector3();
        const rightVector = new THREE.Vector3();
        const moveDir = new THREE.Vector3();

        function animate() {
            requestAnimationFrame(animate);

            if (gameStarted && myPlayer) {
                forwardVector.set(Math.sin(cameraAngleX), 0, Math.cos(cameraAngleX)).normalize();
                rightVector.set(Math.cos(cameraAngleX), 0, -Math.sin(cameraAngleX)).normalize();

                moveDir.set(0, 0, 0);
                if (keys.forward) moveDir.add(forwardVector);
                if (keys.backward) moveDir.sub(forwardVector);
                if (keys.right) moveDir.add(rightVector);
                if (keys.left) moveDir.sub(rightVector);

                if (moveDir.length() > 0) {
                    moveDir.normalize();
                    const nextX = myPlayer.group.position.x + moveDir.x * playerSpeed;
                    const nextZ = myPlayer.group.position.z + moveDir.z * playerSpeed;

                    if (!checkCollision(nextX, myPlayer.group.position.z)) {
                        myPlayer.group.position.x = nextX;
                    }
                    if (!checkCollision(myPlayer.group.position.x, nextZ)) {
                        myPlayer.group.position.z = nextZ;
                    }

                    myPlayer.body.position.y = 0.75 + Math.abs(Math.sin(Date.now() * 0.02)) * 0.15;
                } else {
                    myPlayer.body.position.y = 0.75;
                }

                myPlayer.group.rotation.y = cameraAngleX;

                // 중력 및 바닥/플랫폼 높이 판정
                currentFloorY = getFloorHeight(myPlayer.group.position.x, myPlayer.group.position.z);

                playerVelocity.y -= gravity;
                myPlayer.group.position.y += playerVelocity.y;

                if (myPlayer.group.position.y <= currentFloorY) {
                    myPlayer.group.position.y = currentFloorY;
                    playerVelocity.y = 0;
                    isGrounded = true;
                }

                socket.emit('playerUpdate', {
                    x: myPlayer.group.position.x,
                    y: myPlayer.group.position.y,
                    z: myPlayer.group.position.z,
                    rotationY: myPlayer.group.rotation.y
                });

                for (let i = activeBullets.length - 1; i >= 0; i--) {
                    const b = activeBullets[i];
                    b.mesh.position.addScaledVector(b.dir, 0.9);
                    b.life--;

                    if (b.isMine) {
                        Object.keys(otherPlayers).forEach(id => {
                            const op = otherPlayers[id].group;
                            if (op && b.mesh.position.distanceTo(op.position) < 1.5) {
                                socket.emit('hitPlayer', id);
                                b.life = 0;
                            }
                        });
                    }

                    if (b.life <= 0) {
                        scene.remove(b.mesh);
                        activeBullets.splice(i, 1);
                    }
                }

                const cosY = Math.cos(cameraAngleY);
                const sinY = Math.sin(cameraAngleY);
                const cosX = Math.cos(cameraAngleX);
                const sinX = Math.sin(cameraAngleX);

                const camDir = new THREE.Vector3(sinX * cosY, sinY, cosX * cosY).normalize();
                const worldUp = new THREE.Vector3(0, 1, 0);
                const camRight = new THREE.Vector3().crossVectors(camDir, worldUp).normalize();

                const playerCenter = myPlayer.group.position.clone().add(new THREE.Vector3(0, 1.2, 0));
                
                const dist = 5.0;
                const shoulderOffset = -1.4; 
                const heightOffset = 0.5;

                const camPos = playerCenter.clone()
                    .sub(camDir.clone().multiplyScalar(dist))
                    .add(camRight.clone().multiplyScalar(shoulderOffset))
                    .add(worldUp.clone().multiplyScalar(heightOffset));

                camera.position.copy(camPos);
                camera.lookAt(camPos.clone().add(camDir.clone().multiplyScalar(100)));

                updateTagPosition(myPlayer.group, myNameTag, 1.8);
                Object.keys(otherPlayers).forEach(id => {
                    updateTagPosition(otherPlayers[id].group, otherPlayers[id].tag, 1.8);
                });
            }

            renderer.render(scene, camera);
        }

        function updateTagPosition(targetGroup, tagElem, yOffset) {
            targetGroup.getWorldPosition(tempVector);
            tempVector.y += yOffset;
            tempVector.project(camera);

            const x = (tempVector.x * 0.5 + 0.5) * window.innerWidth;
            const y = (-(tempVector.y * 0.5) + 0.5) * window.innerHeight;

            if (tempVector.z < 1) {
                tagElem.style.display = 'block';
                tagElem.style.left = `${x}px`;
                tagElem.style.top = `${y}px`;
            } else {
                tagElem.style.display = 'none';
            }
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
